name: Build Windows
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "선택한 v* 태그의 빌드 결과를 GitHub Release에 게시"
        type: boolean
        required: false
        default: false
      signed_build:
        description: "코드 서명 필수 (인증서 없는 개발 빌드만 해제)"
        type: boolean
        required: false
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        env:
          REQUIRE_SIGNED: ${{ inputs.signed_build || inputs.publish_release }}
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ($env:REQUIRE_SIGNED -eq 'true' -and (!$env:CERTIFICATE -or !$env:CERTIFICATE_PASSWORD)) {
            throw 'Register WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD in GitHub Secrets. Unsigned development builds require signed_build=false and publish_release=false.'
          }
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install --global yarn@1.22.22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: yarn install --non-interactive
      - run: yarn format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn test:windows
      - name: Cognitive complexity (maximum 5)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D clippy::cognitive_complexity
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: yarn tauri build --no-bundle
      - name: Sign and package portable EXE
        env:
          REQUIRE_SIGNED: ${{ inputs.signed_build || inputs.publish_release }}
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/package_windows.ps1 -RequireSigned:([bool]::Parse($env:REQUIRE_SIGNED))
      - name: Upload PromptWakeup.exe
        uses: actions/upload-artifact@v4
        with:
          name: PromptWakeup-windows-x64-exe
          path: artifacts/portable/PromptWakeup.exe
          if-no-files-found: error
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: PromptWakeup-windows-x64-package
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
  release:
    if: inputs.publish_release && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PromptWakeup-windows-x64-package
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.zip
            release-assets/*.sha256
