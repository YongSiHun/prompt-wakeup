name: 1. Build Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install --global yarn@1.22.22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: yarn install --non-interactive
      - run: yarn format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn test:windows
      - name: Cognitive complexity (maximum 5)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D clippy::cognitive_complexity
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: yarn tauri build --no-bundle
      - name: Upload PromptWakeup.exe
        uses: actions/upload-artifact@v4
        with:
          name: PromptWakeup-windows-x64-exe
          path: src-tauri/target/release/PromptWakeup.exe
          if-no-files-found: error
