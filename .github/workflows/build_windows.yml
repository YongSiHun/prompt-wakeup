name: Build Windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install --global yarn@1.22.22
      - uses: dtolnay/rust-toolchain@stable
      - run: yarn install --non-interactive
      - run: yarn typecheck
      - run: yarn test
      - run: node scripts/offline_check.cjs
      - run: node scripts/windows_shim_smoke.cjs
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: yarn tauri build --no-bundle
      - name: Sign and package portable EXE
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PromptWakeup-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/portable/PromptWakeup.exe
            yarn.lock
            src-tauri/Cargo.lock
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PromptWakeup-windows-x64
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/artifacts/*.zip
            artifacts/artifacts/*.sha256
