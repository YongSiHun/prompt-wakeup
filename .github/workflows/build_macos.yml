name: Build macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install --global yarn@1.22.22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - run: yarn install --non-interactive
      - run: yarn format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - name: Cognitive complexity (maximum 5)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D clippy::cognitive_complexity
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --target ${{ matrix.target }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build and package
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: bash scripts/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PromptWakeup-macos-${{ matrix.arch }}
          path: artifacts/*.zip
          if-no-files-found: error
